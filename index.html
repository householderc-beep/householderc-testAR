<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    a-scene {
      width: 100vw;
      height: 100vh;
    }
    #startButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 16px 32px;
      font-size: 20px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <button id="startButton">Revela Occulta</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.00001; filterBeta: 0.01;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
  >
    <a-assets>
      <img id="overlay" src="./lamielTransF.png" />
      <img id="overlay2" src="./lamielTrans2.png" />
      <img id="overlay3" src="./hot.png" />
      <img id="overlay4" src="./LameilTranDoorway.png" />
      <img id="overlay5" src="./LamielTin.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Real overlay, alphaTest removed for this test - opaque is fine for now -->
      <a-plane
        src="#overlay"
        width="1"
        height="0.935"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
        material="transparent: true; alphaTest: 0.1;"
      ></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane
        src="#overlay2"
        width="1"
        height="0.6"
        position="0 -0.038 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.2"
        material="transparent: true; alphaTest: 0.1;"
      ></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane
        src="#overlay3"
        width="1"
        height="1.074"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
        material="transparent: true; alphaTest: 0.1;"
      ></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-plane
        src="#overlay4"
        width="1"
        height="1.5"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.35 0.35 0.35"
        material="transparent: true; alphaTest: 0.1;"
      ></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-plane
        src="#overlay5"
        width="1"
        height="1.127"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        material="transparent: true; alphaTest: 0.1;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');

    document.querySelector('#startButton').addEventListener('click', () => {
      const mindarSystem = sceneEl.systems['mindar-image-system'];
      if (!mindarSystem) {
        console.error('mindar-image-system not found. Available systems:', Object.keys(sceneEl.systems));
        return;
      }
      mindarSystem.start();
      document.querySelector('#startButton').style.display = 'none';
    });
  </script>

</body>
</html>
