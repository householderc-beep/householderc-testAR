<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Debug console - lets you see errors on the iPad itself -->
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #startButton {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
        padding: 20px 40px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <button id="startButton">Start AR</button>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="card" src="./winghoul.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          src="#card"
          position="0 0 0.05"
          width="1"
          height="1.5"
          rotation="0 0 0"
          transparent="true"
          scale="0.6 0.6 0.6"
        ></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');

      sceneEl.addEventListener('loaded', () => {
        console.log('Scene loaded event fired');
        console.log('Systems available:', Object.keys(sceneEl.systems));
      });

      sceneEl.addEventListener('arError', (event) => {
        console.error('MindAR arError event:', event);
      });

      document.querySelector('#startButton').addEventListener('click', () => {
        console.log('Button clicked');
        console.log('Systems at click time:', Object.keys(sceneEl.systems));

        const mindarSystem = sceneEl.systems['mindar-image-system'];
        if (!mindarSystem) {
          console.error('mindar-image-system not found. Available systems:', Object.keys(sceneEl.systems));
          return;
        }

        mindarSystem.start();
        console.log('start() called successfully');
        document.querySelector('#startButton').style.display = 'none';
      });
    </script>
  </body>
</html>
